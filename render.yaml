services:
  - type: web
    name: salon-website
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn salon_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
